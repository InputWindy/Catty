; Catty / UE-style DefaultEngine.ini
; Working directory should be the project root (or Config/ next to the executable).

[ConsoleVariables]
; Application
app.Name=CattyApp
app.Headless.AutoExitFrames=3

; Window
catty.Window.Width=1280
catty.Window.Height=720
catty.Window.Resizable=1
catty.Window.Create=1

; Default clear color (linear RGB)
catty.ClearColor.R=0.08
catty.ClearColor.G=0.10
catty.ClearColor.B=0.16
catty.ClearColor.A=1.0

; Tick / time
t.FixedDeltaSeconds=0.02
t.MaxFixedUpdatesPerFrame=5
t.MaxDeltaSeconds=0.25

; Garbage collection
gc.CollectInterval=1.0
gc.PurgeInterval=30.0

; Resource pools
res.Pool.PackageInitial=16
res.Pool.ResourceInitial=64

; Rendering
r.VSync=1
r.Swapchain.ExtraImages=1
r.MinSwapchainImages=2
r.ImGui.DescriptorPoolSize=16

; Logging
log.MaxFileBytes=5242880
log.MaxFileCount=3
