; Catty / UE-style DefaultEngine.ini
; Working directory should be the project root (or Config/ next to the executable).

[ConsoleVariables]
; Window
catty.Window.Width=1280
catty.Window.Height=720
catty.Window.Resizable=1
catty.Window.Create=1

; Default clear color (linear RGB)
catty.ClearColor.R=0.08
catty.ClearColor.G=0.10
catty.ClearColor.B=0.16
catty.ClearColor.A=1.0
